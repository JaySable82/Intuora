name: CI/CD Pipeline

on:
  push:
    branches: [ frontend_test ]

env:
  IMAGE_NAME: frontend
  IMAGE_TAG: ${{ github.sha }}
  # Replace these with your actual values
  EC2_HOST: "43.205.198.45"     # e.g., "54.123.45.67"
  EC2_USER: "ubuntu"               # e.g., "ubuntu", "ec2-user", or "admin"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker buildx build --network host -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
        docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ env.IMAGE_NAME }}:latest

    - name: Save Docker image to tar
      run: |
        docker save ${{ env.IMAGE_NAME }}:latest | gzip > image.tar.gz

    - name: Setup SSH key
      run: |
        cp .github/intuora_key.pem intuora_key.pem 
        chmod 600 intuora_key.pem 

    - name: Copy image to EC2
      run: |
        scp -i private_key.pem -o StrictHostKeyChecking=no \
          image.tar.gz ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:/tmp/

    - name: Deploy to EC2
      run: |
        ssh -i private_key.pem -o StrictHostKeyChecking=no \
          ${{ env.EC2_USER }}@${{ env.EC2_HOST }} << 'EOF'
          
          # Load the Docker image
          gunzip -c /tmp/image.tar.gz | docker load
          
          # Stop and remove existing container if it exists
          docker stop ${{ env.IMAGE_NAME }} || true
          docker rm ${{ env.IMAGE_NAME }} || true
          
          # Run the new container
          docker run -d \
            --name ${{ env.IMAGE_NAME }} \
            --restart unless-stopped \
            -p 5173:5173 \
            ${{ env.IMAGE_NAME }}:latest
          
          # Clean up
          rm -f /tmp/image.tar.gz
          
          # Optional: Remove old images to save space
          docker image prune -f
          
        EOF

    - name: Cleanup
      run: |
        rm -f private_key.pem
        rm -f image.tar.gz

  health-check:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - name: Wait for deployment
      run: sleep 30
      
    - name: Health check
      run: |
        curl -f http://${{ env.EC2_HOST }}:5173 || exit 1
        echo "✅ Application is healthy!"
